name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    # GitHub-hosted: free for this public repo, ephemeral per release, and it reaches Sigstore
    # (on 2026-10-11 raven resolved rekor.sigstore.dev to a US endpoint refusing connections).
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing
      contents: write  # Required for creating releases

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.publish.attestation
