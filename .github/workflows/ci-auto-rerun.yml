# Reruns a failed first attempt once when only checkout/setup steps failed
# (runner DNS/download flakes); real failures stay red. Logic lives in the org
# reusable; see apsion-github-org-workflows workflow-templates/ci-auto-rerun.yml.
name: CI Auto Rerun

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    uses: Apsion/apsion-github-org-workflows/.github/workflows/org-ci-auto-rerun.yml@78c00e46887729d4e95665ca1e8a1c8db4e574eb # main
